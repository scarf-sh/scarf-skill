name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"

      - name: Validate static files
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/*.rb; do
            ruby -c "$file"
          done
          ruby scripts/check_skill_structure.rb
          ruby scripts/test_skill_structure.rb
          jq empty references/api-map.json

      - name: Check API coverage
        run: ruby scripts/check_api_coverage.rb

      - name: Run fail-closed mutation suite
        run: ruby scripts/test_api_coverage.rb

      - name: Check changed-file whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
